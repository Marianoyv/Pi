{% if google_analytics_id %}
<section class="analytics-preferences-panel" data-analytics-preferences role="dialog" aria-label="Analytics preferences" hidden>
  <p>Analytics preferences</p>
  <p>Analytics measurement and storage are active by default without an interrupting banner. You can switch to cookieless measurement or turn measurement off. Form contents and contact details are never included.</p>
  <div>
    <button type="button" data-analytics-consent="granted">Keep full analytics on</button>
    <button type="button" data-analytics-consent="denied">Use cookieless measurement</button>
    <button type="button" data-analytics-consent="disabled">Turn measurement off</button>
    <a href="{% url 'policies' %}">Privacy policy</a>
  </div>
</section>
{% endif %}
