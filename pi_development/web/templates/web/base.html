{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="description" content="{% block meta_description %}Pi Development reúne herramientas y sistemas digitales para AdTech, validación de creatividades, rendimiento web, automatización y datos.{% endblock %}">
<meta name="keywords" content="{% block meta_keywords %}herramientas AdTech, arquitectura digital, rendimiento web, validación de creatividades, automatización y datos{% endblock %}">
<link rel="canonical" href="{% block canonical_url %}{{ site_url }}{{ request.path|default:'/' }}{% endblock %}">
<meta property="og:site_name" content="Pi Development">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">
<meta property="og:title" content="{% block og_title %}Pi Development{% endblock %}">
<meta property="og:description" content="{% block og_description %}Pi Development reúne herramientas y sistemas digitales para equipos que necesitan claridad técnica, rendimiento y capacidad de evolución.{% endblock %}">
<meta property="og:image" content="{% static 'web/img/pi.png' %}">
<meta property="og:url" content="{{ site_url }}{{ request.path|default:'/' }}">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Pi Development",
  "url": "https://pidevelopment.web.app",
  "logo": "https://pidevelopment.web.app/static/web/img/pi.png",
  "sameAs": [
    "https://github.com/Marianoyv",
    "https://www.linkedin.com/company/pi-d",
    "https://www.instagram.com/pi.development/"
  ]
}
</script>
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-5RCQCP3');</script>
{% static 'web/img/pi.ico' as favicon_url %}
<link rel="icon" type="image/x-icon" href="{% url 'favicon' %}">
<link rel="shortcut icon" type="image/x-icon" href="{% url 'favicon' %}">
<link rel="alternate icon" href="{{ favicon_url }}?v=20260318">
<link rel="apple-touch-icon" href="{% static 'web/img/pi.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet" href="{% static 'web/css/base.css' %}">
<link rel="stylesheet" href="{% static 'web/css/navbar.css' %}">
<link rel="stylesheet" href="{% static 'web/css/footer.css' %}">
<script src="https://kit.fontawesome.com/70dc13288a.js" crossorigin="anonymous" defer></script>
<title>{% block title %}Pi Development{% endblock %}</title>
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-whatsapp-phone="{{ contact_phone_wa }}">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5RCQCP3"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
{% block content %}{% endblock %}
{% block scripts %}
<script src="{% static 'web/js/main.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
{% endblock %}
</body>
</html>
