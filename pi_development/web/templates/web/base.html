{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="description" content="Pi Development: estrategia digital, desarrollo web, UX/UI y marketing para marcas que buscan crecer.">
<link rel="canonical" href="{{ site_url }}{{ request.path|default:'/' }}">
<meta property="og:site_name" content="Pi Development">
<meta property="og:type" content="website">
<meta property="og:title" content="{% block og_title %}Pi Development{% endblock %}">
<meta property="og:description" content="{% block og_description %}Soluciones digitales personalizadas para tu empresa.{% endblock %}">
<meta property="og:image" content="{% static 'web/img/pi.png' %}">
<link rel="stylesheet" href="{% static 'web/css/base.css' %}">
<meta property="og:url" content="{{ site_url }}{{ request.path|default:'/' }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Pi Development",
  "url": "https://pidevelopment.web.app",
  "logo": "https://pidevelopment.web.app/static/web/img/pi.png",
  "sameAs": [
    "https://github.com/Marianoyv",
    "https://www.linkedin.com/company/pi-d",
    "https://www.instagram.com/pi.development/"
  ]
}
</script>
<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-5RCQCP3');</script>
<!-- End Google Tag Manager -->
<link rel="icon" type="image/x-icon" href="{% static 'web/img/pi.ico' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet" href="{% static 'web/css/base.css' %}">
<link rel="stylesheet" href="{% static 'web/css/navbar.css' %}">
<link rel="stylesheet" href="{% static 'web/css/footer.css' %}">
<script src="https://kit.fontawesome.com/70dc13288a.js" crossorigin="anonymous" defer></script>
<title>{% block title %}Pi Development{% endblock %}</title>
{% block head %}{% endblock %}
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5RCQCP3"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
{% block content %}{% endblock %}
{% block scripts %}
<script src="{% static 'web/js/main.js' %}"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

{% endblock %}
</body>
</html>
