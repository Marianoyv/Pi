<section class="explora" id="tools-preview">
  <div class="explora__layout">
    <div class="section-header section-header--wide explora__header">
      <p class="explora__eyebrow">{{ home_page.tools.eyebrow }}</p>
      <h2>{{ home_page.tools.title }}</h2>
      <p>{{ home_page.tools.description }}</p>
    </div>
    <aside class="explora__support">
      <h3>{{ home_page.tools.support_title }}</h3>
      <p>{{ home_page.tools.support_text }}</p>
    </aside>
  </div>
  <div class="container">
    {% for item in home_page.tools.groups %}
    <article class="card explora-card">
      <div class="card-body p-2">
        <p class="explora-card__label">{{ item.label }}</p>
        <h3 class="card-title">{{ item.title }}</h3>
        <p class="card-text">{{ item.text }}</p>
      </div>
    </article>
    {% endfor %}
  </div>
  <div class="section-actions">
    <a class="button-link button-link--dark" href="{% url 'tools' %}">Explorar herramientas</a>
  </div>
</section>
