{% load static %}
<section class="rellax-section" id="portfolio">
  <div class="layer"></div>
  <div class="portfolio-copy">
    <p class="portfolio-overline">{{ home_page.portfolio.eyebrow }}</p>
    <h2 class="central-text">{{ home_page.portfolio.title }}</h2>
    <p>{{ home_page.portfolio.description }}</p>
    <a class="portfolio-cta" data-portfolio-cta href="{% url 'work' %}">Ver casos</a>
  </div>
  {% for item in portfolio_items %}
  <a class="rellax card-proyecto card-proyecto--{{ forloop.counter }}" data-rellax-speed="{% cycle '-3' '1' '-3' '-4' '-2' '2' %}" href="{{ item.url }}" target="_blank" rel="noopener noreferrer" aria-label="Abrir proyecto {{ item.name }}">
    <img src="{% static item.image %}" alt="Sitio web de {{ item.name }}">
  </a>
  {% endfor %}
</section>
