<section id="vanta-hero" class="showcase">
  <div class="layer"></div>
  <div class="text" id="fade-text">
    <p class="hero-eyebrow">{{ home_page.hero.eyebrow }}</p>
    <h1>{{ home_page.hero.title }}</h1>
    <p class="hero-lead">{{ home_page.hero.description }}</p>
    <div class="hero-actions">
      <a class="button-link" href="{% url 'tools' %}">Usar herramientas</a>
      <a class="button-link button-link--dark" href="{% url 'systems' %}">Ver arquitectura</a>
    </div>
    <div class="hero-signals">
      {% for item in home_page.hero.signals %}
      <article class="hero-signal">
        <span>{{ item.label }}</span>
        <p>{{ item.text }}</p>
      </article>
      {% endfor %}
    </div>
  </div>
  <ul class="social">
    <li><a href="https://github.com/Marianoyv" target="_blank" rel="noopener noreferrer" aria-label="Ir al perfil de GitHub de Pi Development"><i class="fa-brands fa-github"></i></a></li>
    <li><a href="https://www.linkedin.com/company/pi-d" target="_blank" rel="noopener noreferrer" aria-label="Ir al perfil de LinkedIn de Pi Development"><i class="fa-brands fa-linkedin"></i></a></li>
    <li><a href="https://www.instagram.com/pi.development/" target="_blank" rel="noopener noreferrer" aria-label="Ir al perfil de Instagram de Pi Development"><i class="fa-brands fa-instagram"></i></a></li>
  </ul>
</section>
