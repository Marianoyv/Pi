<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found</title>

    <style media="screen">
      :root { --bg: #0B0F14; --surface: #0F172A; --border: #334155; --text: #E2E8F0; --text-secondary: #94A3B8; --text-muted: #64748B; --white: #F8FAFC; --primary: #2D6CDF; }
      body { background: var(--bg); color: var(--text-secondary); font-family: Inter, ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 0; }
      #message { background: var(--surface); border: 1px solid var(--border); max-width: 360px; margin: 100px auto 16px; padding: 32px 24px 16px; border-radius: 12px; }
      #message h3 { color: var(--text-muted); font-weight: normal; font-size: 16px; margin: 16px 0 12px; }
      #message h2 { color: var(--primary); font-weight: bold; font-size: 16px; margin: 0 0 8px; }
      #message h1 { font-size: 22px; font-weight: 300; color: var(--white); margin: 0 0 16px;}
      #message p { line-height: 140%; margin: 16px 0 24px; font-size: 14px; }
      #message a { display: block; text-align: center; background: var(--primary); text-transform: uppercase; text-decoration: none; color: var(--white); padding: 16px; border-radius: 8px; }
      #message, #message a { box-shadow: 0 1px 3px rgba(11,15,20,0.24), 0 1px 2px rgba(11,15,20,0.38); }
      #load { color: var(--text-muted); text-align: center; font-size: 13px; }
      @media (max-width: 600px) {
        body, #message { margin-top: 0; box-shadow: none; }
        body { border-top: 16px solid var(--primary); }
      }
    </style>
  </head>
  <body>
    <div id="message">
      <h2>404</h2>
      <h1>Page Not Found</h1>
      <p>The specified file was not found on this website. Please check the URL for mistakes and try again.</p>
      <h3>Why am I seeing this?</h3>
      <p>This page was generated by the Firebase Command-Line Interface. To modify it, edit the <code>404.html</code> file in your project's configured <code>public</code> directory.</p>
    </div>
  </body>
</html>
