<section class="serv" id="systems-intro">
  <div class="section-header section-header--wide serv__header">
    <p class="serv__eyebrow">{{ home_page.systems.eyebrow }}</p>
    <h2>{{ home_page.systems.title }}</h2>
    <p>{{ home_page.systems.description }}</p>
    <p class="serv__support-copy">{{ home_page.systems.support_text }}</p>
    <div class="section-actions serv__actions">
      <a class="button-link button-link--dark" href="{% url 'systems' %}">Ver arquitectura</a>
    </div>
  </div>
  <div class="cards">
    {% for item in home_page.systems.groups %}
    <a class="service-card-link" href="{% url 'systems' %}">
      <article class="card">
        <p class="serv__card-label">{{ item.label }}</p>
        <h3>{{ item.title }}</h3>
        <p>{{ item.text }}</p>
        <strong>{{ item.outcome }}</strong>
      </article>
    </a>
    {% endfor %}
  </div>
</section>
