<section id="approach-preview" class="proceso-section">
  <div class="section-header section-header--wide section-header--light">
    <p class="proceso-eyebrow">{{ home_page.approach.eyebrow }}</p>
    <h2>{{ home_page.approach.title }}</h2>
    <p>{{ home_page.approach.description }}</p>
  </div>
  <div class="container proceso-container">
    {% for item in home_page.approach.steps %}
    <article class="proceso-step">
      <span class="proceso-step__index">{{ item.number }}</span>
      <h3>{{ item.title }}</h3>
      <p>{{ item.text }}</p>
    </article>
    {% endfor %}
  </div>
  <p class="proceso-note">{{ home_page.approach.note }}</p>
  <div class="section-actions">
    <a class="button-link button-link--dark" href="{% url 'approach' %}">Ver método</a>
  </div>
</section>
