{% extends 'web/base.html' %}
{% block title %}Contacto | Pi Development{% endblock %}
{% block head %}
<meta name="description" content="¿Tenés un proyecto en mente? Escribinos y empecemos a trabajar juntos.">
<link rel="canonical" href="https://pidevelopment.web.app/contact/">
{% endblock %}

{% block content %}
<section class="contact">
  <h1>Contacto</h1>
  <form action="#" method="post">
    <label for="name">Nombre:</label>
    <input type="text" id="name" name="name" placeholder="Tu nombre" required>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Tu email" required>
    <label for="message">Mensaje:</label>
    <textarea id="message" name="message" placeholder="Escribí tu mensaje..."></textarea>
    <button type="submit">Enviar</button>
  </form>
</section>
{% endblock %}
